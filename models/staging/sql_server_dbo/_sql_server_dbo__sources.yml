version: 2

sources:
  - name: sql_server_dbo
    schema: sql_server_dbo
    database: alumno8_dev_bronze_db

    quoting:
      database: false
      schema: false
      identifier: false
      
    tables:
      - name: addresses
        loaded_at_field: _fivetran_synced
        columns:
          - name: address_id
            tests: [not_null, unique]
          - name: zipcode
          - name: country
            tests: [not_null]
          - name: address
          - name: state
          - name: _fivetran_deleted
          - name: _fivetran_synced
            tests: [not_null]

      - name: events
        loaded_at_field: _fivetran_synced
        columns:
          - name: event_id
            tests: [not_null, unique]
          - name: page_url
          - name: event_type
            tests: [not_null]
          - name: user_id
            tests:
              - relationships:
                  to: source('sql_server_dbo','users')
                  field: user_id
          - name: product_id
            tests:
              - relationships:
                  to: source('sql_server_dbo','products')
                  field: product_id
          - name: session_id
          - name: created_at
            tests: [not_null]
          - name: order_id
            tests:
              - relationships:
                  to: source('sql_server_dbo','orders')
                  field: order_id
          - name: _fivetran_deleted
          - name: _fivetran_synced
            tests: [not_null]

      - name: orders
        loaded_at_field: _fivetran_synced
        columns:
          - name: order_id
            tests: [not_null, unique]
          - name: shipping_service
          - name: shipping_cost
          - name: address_id
            tests:
              - relationships:
                  to: source('sql_server_dbo','addresses')
                  field: address_id
          - name: created_at
            tests: [not_null]
          - name: promo_id
            tests:
              - relationships:
                  to: source('sql_server_dbo','promos')
                  field: promo_id
          - name: estimated_delivery_at
          - name: order_cost
          - name: user_id
            tests:
              - relationships:
                  to: source('sql_server_dbo','users')
                  field: user_id
          - name: order_total
          - name: delivered_at
          - name: tracking_id
          - name: status
          - name: _fivetran_deleted
          - name: _fivetran_synced
            tests: [not_null]

      - name: order_items
        loaded_at_field: _fivetran_synced
        columns:
          - name: order_id
            tests:
              - not_null
              - relationships:
                  to: source('sql_server_dbo','orders')
                  field: order_id
          - name: product_id
            tests:
              - not_null
              - relationships:
                  to: source('sql_server_dbo','products')
                  field: product_id
          - name: quantity
            tests: [not_null]
          - name: _fivetran_deleted
          - name: _fivetran_synced
            tests: [not_null]

      - name: products
        loaded_at_field: _fivetran_synced
        columns:
          - name: product_id
            tests: [not_null, unique]
          - name: price
          - name: name
            tests: [not_null]
          - name: inventory
          - name: _fivetran_deleted
          - name: _fivetran_synced
            tests: [not_null]

      - name: promos
        loaded_at_field: _fivetran_synced
        columns:
          - name: promo_id
            tests: [not_null, unique]
          - name: discount
          - name: status
            tests:
              - accepted_values:
                  values: ['active','inactive']
          - name: _fivetran_deleted
          - name: _fivetran_synced
            tests: [not_null]

      - name: users
        loaded_at_field: _fivetran_synced
        columns:
          - name: user_id
            tests: [not_null, unique]
          - name: updated_at
          - name: address_id
            tests:
              - relationships:
                  to: source('sql_server_dbo','addresses')
                  field: address_id
          - name: last_name
          - name: created_at
            tests: [not_null]
          - name: phone_number
          - name: total_orders
          - name: first_name
          - name: email     
          - name: _fivetran_deleted
          - name: _fivetran_synced
            tests: [not_null]
