version: 2

sources:
  - name: google_sheets
    schema: google_sheets
    database: "{{ env_var('DBT_ENVIRONMENTS') }}_BRONZE_DB"

    quoting:
      database: false
      schema: false
      identifier: false

    tables:
      - name: budget
        loaded_at_field: _fivetran_synced
        columns:
          - name: _row
            tests: [not_null, unique]
          - name: quantity
            tests: [not_null]
          - name: month
            tests: [not_null]
          - name: product_id
            tests:
              - not_null
              - relationships:
                  to: source('sql_server_dbo','products')
                  field: product_id
          - name: _fivetran_synced
            tests: [not_null]
